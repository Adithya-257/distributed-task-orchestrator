services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orchestrator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-service:
    build: ./api-service
    container_name: api-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_URL: postgresql://admin:password@postgres:5432/orchestrator
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-service:
    build: ./worker-service
    container_name: worker-service
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_URL: postgresql://admin:password@postgres:5432/orchestrator
      WORKER_CONCURRENCY: 5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data: